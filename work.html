<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Проекты &mdash; Фёдор</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
</head>

<body data-page="work">
  <header>
    <div class="header-inner">
      <a href="index.html" class="logo">Фёдор Баев</a>

      <input type="checkbox" id="burger-toggle" class="burger-checkbox">

      <label for="burger-toggle" class="burger-btn" aria-label="Открыть меню">
        <span></span>
        <span></span>
        <span></span>
      </label>

      <nav>
        <a href="index.html">Главная</a>
        <a href="about.html">Обо мне</a>
        <a href="hobbies.html">Хобби</a>
        <a href="contacts.html">Контакты</a>
        <a href="skills.html">Навыки</a>
        <a href="tools.html">Инструменты</a>
        <a href="work.html" class="active">Проекты</a>
        <a href="api-table.html">API</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <h1>Мои проекты</h1>
    <p class="lead">Всё, что я успел сделать за время обучения.</p>

    <!-- Фильтры -->
    <section class="table-controls" aria-label="Фильтры проектов">
      <label class="table-controls__field">
        <span>Поиск</span>
        <input id="proj-search" type="search" placeholder="Название или описание..." autocomplete="off">
      </label>
      <label class="table-controls__field">
        <span>Технология</span>
        <select id="proj-tech">
          <option value="">Все</option>
        </select>
      </label>
      <label class="table-controls__field">
        <span>Год</span>
        <select id="proj-year">
          <option value="">Все</option>
        </select>
      </label>
      <label class="table-controls__field">
        <span>Статус</span>
        <select id="proj-status">
          <option value="">Все</option>
        </select>
      </label>
      <button id="proj-reset" class="table-controls__btn" type="button">Сбросить</button>
    </section>

    <p class="table-meta" id="proj-meta"></p>

    <!-- Таблица проектов -->
    <div class="table-wrap">
      <table class="data-table" id="proj-table">
        <thead>
          <tr>
            <th class="sortable" data-key="title">Название ↕</th>
            <th>Описание</th>
            <th>Технологии</th>
            <th class="sortable" data-key="year">Год ↕</th>
            <th class="sortable" data-key="status">Статус ↕</th>
            <th>Ссылка</th>
          </tr>
        </thead>
        <tbody id="proj-tbody"></tbody>
      </table>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 Фёдор Баев. Все права защищены.</p>
  </footer>

  <script type="module" src="js/main.js"></script>
</body>
</html>
